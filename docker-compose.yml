version: '3.8'

services:
  service-registry:
    image: service-registry
    build: ./service-registry
    ports:
      - "8761:8761"

  config-server:
    image: config-server
    build: ./config-server
    ports:
      - "8888:8888"
    depends_on:
      - service-registry
    volumes:
      - ./config-repo:/config-repo
    environment:
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config-repo

  auth-service:
    image: auth-service
    build: ./services/auth-service
    ports:
      - "8082:8082"
    depends_on:
      - config-server
    volumes:
      - ./config-repo:/config-repo
    environment:
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config-repo

  user-service:
    image: user-service
    build: ./services/user-service
    ports:
      - "8083:8083"
    depends_on:
      - config-server
    volumes:
      - ./config-repo:/config-repo
    environment:
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config-repo

  product-service:
    image: product-service
    build: ./services/product-service
    ports:
      - "8085:8085"
    depends_on:
      - config-server
    volumes:
    - ./logs/product-service:/logs
    - ./config-repo:/config-repo
    environment:
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config-repo

  order-service:
    image: order-service
    build: ./services/order-service
    ports:
      - "8087:8087"
    depends_on:
      - config-server
    volumes:
    - ./logs/order-service:/logs
    - ./config-repo:/config-repo
    environment:
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config-repo

  cart-service:
    image: cart-service
    build: ./services/cart-service
    ports:
      - "8088:8088"
    depends_on:
      - config-server
      - redis
    volumes:
    - ./logs/cart-service:/logs
    - ./config-repo:/config-repo
    environment:
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config-repo

  review-service:
    image: review-service
    build: ./services/review-service
    ports:
      - "8084:8084"
    depends_on:
      - config-server
    volumes:
      - ./config-repo:/config-repo
    environment:
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config-repo

  chat-service:
    image: chat-service
    build: ./services/chat-service
    ports:
      - "8086:8086"
    depends_on:
      - config-server
    volumes:
      - ./config-repo:/config-repo
    environment:
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config-repo

  cartitem-service:
    image: cartitem-service
    build: ./services/cartItem-service
    ports:
      - "8089:8089"
    depends_on:
      - config-server
    volumes:
      - ./config-repo:/config-repo
    environment:
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config-repo

  payment-service:
    image: payment-service
    build: ./services/payment-service
    ports:
      - "8094:8094"
    depends_on:
      - config-server
    volumes:
      - ./config-repo:/config-repo
    environment:
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config-repo

  recommended-service:
    image: recommended-service
    build: ./services/recommended-service
    ports:
      - "8092:8092"
    depends_on:
      - config-server
    volumes:
      - ./config-repo:/config-repo
    environment:
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config-repo


  api-gateway:
    image: api-gateway
    build: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - config-server
    volumes:
      - ./config-repo:/config-repo
    environment:
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config-repo

  mysql-db:
    image: mysql:8
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: 123456
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  mysql_data:
