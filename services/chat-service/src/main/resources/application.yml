server:
  port: 8086

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/chat_service
    username: root
    password: 123456
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
  application:
    name: chat-service


product:
  service-url: http://localhost:8080/api/products/ai/search
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

