server:
  port: 8084

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/review_service
    username: root
    password: 123456
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  application:
    name: review-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.web.server: DEBUG
    org.springframework.boot.autoconfigure.web: DEBUG

