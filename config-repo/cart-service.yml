server:
  port: 8088

spring:
  datasource:
    url: jdbc:mysql://mysql-db:3306/cart_service?useSSL=false&serverTimezone=UTC
    username: root
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  redis:
    host: localhost     
    port: 6379
    database: 0

eureka:
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka

logging:
  level:
    root: INFO
    com.cart.cartservice: DEBUG
    org.springframework.data.redis: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/cart-service.log
