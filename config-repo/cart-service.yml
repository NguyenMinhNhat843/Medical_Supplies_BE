server:
  port: 8088

spring:
  datasource:
    url: jdbc:mysql://mysql-db:3306/cart_service?useSSL=false&serverTimezone=UTC
    username: root
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
eureka:
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka

  redis:
    host: localhost
    port: 6379
    database: 0

logging:
  level:
    root: INFO  # Cấp độ log mặc định cho toàn ứng dụng
    com.cart.cartservice: DEBUG  # Log chi tiết cho package của cart-service
    org.springframework.data.redis: DEBUG  # Log chi tiết cho Redis
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"  # Định dạng log trên console
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"  # Định dạng log trong file
  file:
    name: logs/cart-service.log  # Đường dẫn file log
