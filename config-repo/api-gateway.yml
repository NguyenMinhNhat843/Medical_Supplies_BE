server:
  port: 8080

spring:
  application:
    name: api-gateway

  redis:
    host: localhost
    port: 6379

  cloud:
    gateway:
      default-filters:
        - name: RequestRateLimiter
          args:
            key-resolver: "#{@remoteAddrKeyResolver}"     # Sử dụng IP làm khóa phân biệt
            redis-rate-limiter.replenishRate: 5           # Cấp phát 5 token mỗi phút (xem lưu ý bên dưới)
            redis-rate-limiter.burstCapacity: 5           # Cho phép tối đa 5 request liên tiếp
            redis-rate-limiter.redis-time-to-live: 60s    # Token key tồn tại trong Redis trong 60 giây
            redis-rate-limiter.requestedTokens: 1         # Mỗi request tiêu thụ 1 token
            includeHeaders: true

      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**
        - id: product-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/products/**, /api/category/**, /api/picture/repository/**
        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/orders/**, /api/notifications/** , /api/vouchers/**
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/users/**
        - id: review-service
          uri: lb://REVIEW-SERVICE
          predicates:
            - Path=/reviews/**
        - id: chat-service
          uri: lb://CHAT-SERVICE
          predicates:
            - Path=/chat/**
        - id: cart-service
          uri: lb://CART-SERVICE
          predicates:
            - Path=/api/carts/**
        - id: cart-item-service
          uri: lb://CARTITEM-SERVICE
          predicates:
            - Path=/api/cart-items/**
        - id: inventory-service
          uri: lb://INVENTORY-SERVICE
          predicates:
            - Path=/api/inventory/**
        - id: admin-dashboard-service
          uri: lb://ADMIN-DASHBOARD-SERVICE
          predicates:
            - Path=/api/dashboard/**
        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/payments/**, /api/stripe/**
        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/notification/**
        - id: recommend-service
          uri: lb://RECOMMEND-SERVICE
          predicates:
            - Path=/api/recommend/**

  jwt:
    secretKey: mySuperSecretKey0123456789ABCDEFGHIJTEAMNEXUS5KTTKPM

logging:
  level:
    org.springframework.security: DEBUG