server:
  port: 8080

spring:
  application:
    name: api-gateway

  redis:
    host: localhost
    port: 6379

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**

        - id: product-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/products/**, /api/category/**, /api/picture/repository/**
          filters:
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@fixedWindowRateLimiter}"   
                key-resolver: "#{@remoteAddrKeyResolver}"    
                includeHeaders: true

        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/orders/**, /api/notifications/** , /api/vouchers/**

        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/users/**

        - id: review-service
          uri: lb://REVIEW-SERVICE
          predicates:
            - Path=/reviews/**

        - id: chat-service
          uri: lb://CHAT-SERVICE
          predicates:
            - Path=/chat/**

        - id: cart-service
          uri: lb://CART-SERVICE
          predicates:
            - Path=/api/carts/**

        - id: cart-item-service
          uri: lb://CARTITEM-SERVICE
          predicates:
            - Path=/api/cart-items/**

        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/payments/**, /api/stripe/**


        - id: recommended-service
          uri: lb://RECOMMENDED-SERVICE
          predicates:
            - Path=/api/recommended/**

  jwt:
    secretKey: mySuperSecretKey0123456789ABCDEFGHIJTEAMNEXUS5KTTKPM
eureka:
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka
logging:
  level:
    org.springframework.security: DEBUG
